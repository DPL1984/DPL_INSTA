name: Build DPL reel

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config stem in reels/configs, without .json"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONFIG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install python deps
        run: pip install --quiet pillow numpy fonttools

      - name: Instance fonts
        run: |
          mkdir -p build/fonts build/src
          python3 - <<'PY'
          import subprocess
          from fontTools.ttLib import TTFont
          from fontTools.varLib import instancer
          SRC = {
            "EBGaramond": "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf",
            "Montserrat": "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf",
          }
          OUT = {"EBGaramond": [("EBG-600",600),("EBG-700",700)],
                 "Montserrat": [("Mont-500",500),("Mont-700",700)]}
          for fam, url in SRC.items():
              raw = f"build/src/{fam}-var.ttf"
              subprocess.run(["curl","-sSL","-o",raw,url], check=True)
              for name, w in OUT[fam]:
                  TTFont(raw)
                  f = TTFont(raw)
                  instancer.instantiateVariableFont(f, {"wght": w}, inplace=False).save(f"build/fonts/{name}.ttf")
          PY

      - name: Grade the footage once
        working-directory: build
        run: |
          set -euo pipefail
          cp ../reels/footage.py ../reels/overlay_ask.py ../reels/measure.py ../reels/safezone_check.py .
          cp "../reels/configs/$CONFIG.json" cfg.json
          python3 footage.py cfg.json

      - name: Render each platform to its own safe zone
        working-directory: build
        run: |
          set -euo pipefail
          mkdir -p out
          for P in instagram x tiktok; do
            echo "::group::$P"
            python3 - "$P" <<'PY'
          import json, os, sys
          p = sys.argv[1]; stem = os.environ["CONFIG"]
          c = json.load(open("cfg.json"))
          c["out"] = f"out/{stem}-{p}.mp4"
          json.dump(c, open(f"cfg-{p}.json", "w"))
          PY
            DPL_PLATFORM=$P DPL_SCRIM=light python3 safezone_check.py "cfg-$P.json"
            DPL_PLATFORM=$P DPL_SCRIM=light python3 overlay_ask.py "cfg-$P.json"
            ffmpeg -v error -y -i "out/$CONFIG-$P.mp4" -vf "select='eq(n,100)'" -vsync 0 \
              -frames:v 1 -q:v 2 "out/$CONFIG-$P-cover.jpg"
            python3 measure.py "out/$CONFIG-$P.mp4" | tee "out/$CONFIG-$P-measurements.txt"
            echo "::endgroup::"
          done

      - name: Gate on the playbook numbers
        working-directory: build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          stem = os.environ["CONFIG"]; bad = []
          for p in ("instagram", "x", "tiktok"):
              t = open(f"out/{stem}-{p}-measurements.txt").read()
              g = lambda k: float(re.search(rf"{k}\s+([\d.]+)", t).group(1))
              dur, con = g("duration"), g("opening contrast")
              mot, loop = g("motion, first sec"), g("loop delta")
              print(f"--- {p} ---"); print(t)
              if abs(dur - 8.0) > 0.01: bad.append(f"{p} duration {dur}")
              if con < 70:  bad.append(f"{p} opening contrast {con}, gate 70")
              if mot <= 4.0: bad.append(f"{p} first-second motion {mot}, gate 4.0")
              if loop >= 10: bad.append(f"{p} loop delta {loop}, gate 10")
          if bad:
              print("GATE FAILED: " + "; ".join(bad)); sys.exit(1)
          print("all gates passed on all three platforms")
          PY
          for P in instagram x tiktok; do
            ffprobe -v error -select_streams a -show_entries stream=codec_type \
              -of csv=p=0 "out/$CONFIG-$P.mp4" > /tmp/a.txt
            if [ -s /tmp/a.txt ]; then echo "GATE FAILED: $P has an audio stream"; exit 1; fi
          done
          echo "no audio stream on any platform, correct"

      - name: Commit
        run: |
          set -euo pipefail
          DEST="reels/out/$CONFIG"
          mkdir -p "$DEST"
          cp build/out/$CONFIG-*.mp4 build/out/$CONFIG-*-cover.jpg build/out/$CONFIG-*-measurements.txt "$DEST/"
          git config user.name "DPL build bot"
          git config user.email "disasterprooflife@outlook.com"
          git add "$DEST"
          git commit -m "reels: built $CONFIG, three platform safe zones" || { echo "nothing changed"; exit 0; }
          git pull --rebase
          git push
          echo "Raw URLs:"
          for P in instagram x tiktok; do
            echo "  https://raw.githubusercontent.com/DPL1984/DPL_INSTA/main/$DEST/$CONFIG-$P.mp4"
          done
